aid: yubi-fka-credavenue
name: Yubi (fka CredAvenue)
description: >-
  Yubi (formerly CredAvenue) is a Chennai-based Indian fintech that operates a
  unified technology platform for debt and credit markets, connecting borrowers,
  lenders, and investors. Its product suite spans Yubi Loans (corporate lending),
  Yubi Co.lend (bank–NBFC co-lending), Yubi Pools (securitisation), Yubi Invest
  (fixed-income investing), Yubi Flow (supply-chain finance), and Yubi Build
  (infrastructure and real-estate financing). Yubi exposes self-serve REST APIs —
  first publicised for the Yubi Co.lend co-lending workflow — that let banks and
  NBFCs configure loan products and integrate their systems directly. Developer
  documentation is published on a Theneo-hosted developer portal at
  developer.go-yubi.com. This profile was added to the API Evangelist network as a
  portfolio-company lead of Insight Partners and enriched from Yubi's public
  developer, product, and security surfaces.
